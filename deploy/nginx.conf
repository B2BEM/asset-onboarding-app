# TLS termination for the Asset Onboarding Tool (compose service `nginx`).
# Certs: data/certs/server.crt + server.key from your organization's internal CA (see DEPLOY.md).

# Genericize the Server header (nginx/1.27.5 -> nginx) on ALL responses, including
# nginx-generated error pages — don't advertise the exact version (header hardening 2026-07-07).
server_tokens off;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Proxy-level security headers (the app also sets nosniff/frame/referrer;
    # HSTS only makes sense here, at the TLS terminator).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CSV exports of the full register are small (<10 MB) but keep headroom.
    client_max_body_size 20m;

    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
