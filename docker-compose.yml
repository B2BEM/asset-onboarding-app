# Asset Onboarding Tool — on-prem VM deployment (README §12 phase 7).
# nginx terminates TLS on 443 and proxies to the app; SQLite + certs live on ./data.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Behind nginx: honour X-Forwarded-* so secure cookies work (see server.js).
      TRUST_PROXY: "1"
    volumes:
      - ./data:/app/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:'+(process.env.PORT||8080)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # server.crt / server.key issued by your organization's internal CA (see DEPLOY.md)
      - ./data/certs:/etc/nginx/certs:ro
